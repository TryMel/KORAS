name: koras_mobile
description: "KORAS — Assistant numérique agentique mobile (Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management (Section 10.1)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.4

  # Navigation (Section 10.1)
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.2

  # Local Storage & Security (Section 92)
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Audio / Voice
  permission_handler: ^11.4.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  shimmer: ^3.0.0

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.4.4
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
