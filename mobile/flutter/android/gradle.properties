org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Set JDK to Android Studio's bundled JDK 21 (fixes JDK 26 jlink incompatibility with Android SDK)
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# Flutter template flags
android.newDsl=false
android.builtInKotlin=false
# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Fix Windows cross-drive path issue between C: and D:
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
# Disable NDK auto-download (we install manually via sdkmanager)
android.ndkVersion=28.2.13676358
